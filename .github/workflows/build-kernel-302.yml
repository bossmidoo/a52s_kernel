name: Build a52sxq KernelSU-Next kernel (5.4.302)

# Builds the kernel for the device's CURRENT firmware (kernel 5.4.302,
# clang 22.0.2), with KernelSU-Next + SUSFS merged in by hand, since no
# public source tree with KernelSU already integrated against 302
# exists yet.
#
# Base source: anhdat1024/android_kernel_samsung_sm7325, branch 17.0
#   (SUBLEVEL=302, confirmed by commit hash match against the stock
#   kernel's own version banner: "...g7a71935c393b..." = this branch's
#   HEAD commit 7a71935c393b24dbe23b3caf7eb37cdf64aa820b)
#
# KernelSU-Next + SUSFS patch: ksu-302-merge.patch (next to this file).
# How it was produced: A52s-5G-Testing/kernel_samsung_sm7325-root
# (the only public KSU-integrated source for this device) is stuck on
# the OLDER kernel_samsung_sm7325 base, SUBLEVEL=254. Its KernelSU
# integration is commits aad7c518c..a70843aa5 (18 commits, purely
# additive: 80 files changed, 12458 insertions, 0 deletions - no
# existing kernel code was modified, only new drivers/kernelsu/* files
# and small #ifdef-guarded hook additions). That full diff was
# extracted and replayed against this 302 base:
#   - 77 of 80 files applied with clean/fuzzy offsets, no changes needed.
#   - include/linux/seccomp.h: dropped entirely - 302 already has the
#     same atomic_t filter_count field upstream, natively.
#   - arch/arm64/configs/vendor/lineage-a52sxq_defconfig: same 20 KSU
#     Kconfig lines, just re-inserted above 302's (not 254's) header.
#   - fs/proc/fd.c: same SUSFS mnt_id-spoofing hook, hand-adapted to
#     302's newer seq_printf format (which added an "ino:" field
#     upstream, unrelated to KernelSU, that the original 254-era patch
#     didn't know about).
# The resulting combined patch was verified to `git apply --check`
# with exit code 0 against a completely fresh clone of 17.0.
#
# Run it from Actions tab -> "Build a52sxq KernelSU-Next kernel (5.4.302)" -> Run workflow.
# Output: artifact "a52sxq-ksu-next-kernel-302" with Image + build.log.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "owner/repo of the 302 base kernel source"
        required: true
        default: "anhdat1024/android_kernel_samsung_sm7325"
      kernel_ref:
        description: "Branch/tag to build"
        required: true
        default: "17.0"
      defconfig:
        description: "Defconfig path under arch/arm64/configs/"
        required: true
        default: "vendor/lineage-a52sxq_defconfig"
      clang_release:
        description: "ZyCromerZ/Clang release tag to use as toolchain"
        required: true
        default: "11.1.0-20220724-release"
      clang_tarball:
        description: "Matching tarball file name for that release"
        required: true
        default: "Clang-11.1.0-20220724.tar.gz"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      # Checks out THIS repo (to get ksu-302-merge.patch) into the
      # workspace root; the kernel source itself is checked out
      # separately below, into ./kernel.
      - name: Checkout this repo (for the merge patch)
        uses: actions/checkout@v4

      - name: Checkout 302 kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1
          path: kernel

      - name: Apply KernelSU-Next + SUSFS merge patch
        working-directory: kernel
        run: |
          set -e
          git apply --verbose ../ksu-302-merge.patch
          echo "--- sanity check ---"
          grep -m3 -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile
          test -d drivers/kernelsu

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential git curl ca-certificates python3 \
            rsync unzip zip

      - name: Download clang toolchain (self-contained, includes its own binutils)
        run: |
          set -e
          mkdir -p clang
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/ZyCromerZ/Clang/releases/download/${{ inputs.clang_release }}/${{ inputs.clang_tarball }}" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions (sanity check)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version
          ld.lld --version
          llvm-ar --version

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 DISABLE_WRAPPER=1 ${{ inputs.defconfig }}
          # Plain redirection, NOT `| tee`: a pipe's reader (tee) can
          # close at any moment under heavy parallel (-jN) load, and
          # this specific clang/llvm build (11.1.0) crashes outright
          # ("LLVM ERROR: IO failure on output stream: Broken pipe",
          # e.g. in llvm-nm) if it gets SIGPIPE while writing to a
          # closed pipe. Writing straight to a file has no reader to
          # close, so that whole crash class is structurally impossible
          # here. (Trade-off: the Actions UI "live" log for this one
          # step stays blank until it finishes - the full output is
          # still in build.log, uploaded as an artifact either way.)
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 DISABLE_WRAPPER=1 -j"$(nproc)" > ../build.log 2>&1

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts
          found=0
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              cp "kernel/out/arch/arm64/boot/$f" artifacts/
              found=1
            fi
          done
          find kernel/out -maxdepth 4 -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          ls -la artifacts/
          if [ "$found" -eq 0 ]; then
            echo "::error::No kernel Image/Image.gz/Image.gz-dtb was produced - the build failed. Check build.log in the uploaded artifact."
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-ksu-next-kernel-302
          path: artifacts/
          retention-days: 14
