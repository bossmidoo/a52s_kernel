name: Build a52sxq KernelSU-Next kernel (5.4.302)

# Builds the kernel for the device's CURRENT firmware (kernel 5.4.302,
# clang 22.0.2), with KernelSU-Next + SUSFS merged in by hand, since no
# public source tree with KernelSU already integrated against 302
# exists yet.
#
# Base source: anhdat1024/android_kernel_samsung_sm7325, branch 17.0
#   (SUBLEVEL=302, confirmed by commit hash match against the stock
#   kernel's own version banner: "...g7a71935c393b..." = this branch's
#   HEAD commit 7a71935c393b24dbe23b3caf7eb37cdf64aa820b)
#
# KernelSU-Next + SUSFS patch: ksu-302-merge.patch (next to this file).
# How it was produced: A52s-5G-Testing/kernel_samsung_sm7325-root
# (the only public KSU-integrated source for this device) is stuck on
# the OLDER kernel_samsung_sm7325 base, SUBLEVEL=254. Its KernelSU
# integration is commits aad7c518c..a70843aa5 (18 commits, purely
# additive: 80 files changed, 12458 insertions, 0 deletions - no
# existing kernel code was modified, only new drivers/kernelsu/* files
# and small #ifdef-guarded hook additions). That full diff was
# extracted and replayed against this 302 base:
#   - 77 of 80 files applied with clean/fuzzy offsets, no changes needed.
#   - include/linux/seccomp.h: dropped entirely - 302 already has the
#     same atomic_t filter_count field upstream, natively.
#   - arch/arm64/configs/vendor/lineage-a52sxq_defconfig: same 20 KSU
#     Kconfig lines, just re-inserted above 302's (not 254's) header.
#   - fs/proc/fd.c: same SUSFS mnt_id-spoofing hook, hand-adapted to
#     302's newer seq_printf format (which added an "ino:" field
#     upstream, unrelated to KernelSU, that the original 254-era patch
#     didn't know about).
# The resulting combined patch was verified to `git apply --check`
# with exit code 0 against a completely fresh clone of 17.0.
#
# UPDATE 1: the patch disables Clang LTO (CONFIG_LTO_NONE=y, CFI_CLANG
# dropped as a dependent) - a first attempt at fixing a build crash where
# llvm-nm aborted with "LLVM ERROR: IO failure on output stream: Broken
# pipe". This alone was NOT enough: with LTO off, the exact same class of
# crash reappeared later in the build, this time from llvm-objdump instead.
#
# UPDATE 2 (the real fix): scripts/Makefile.build's cmd_modversions_c runs,
# for every object file that exports symbols, a shell idiom like
# `$(LLVM_NM) $@ | grep -q __ksymtab` (or the same with $(OBJDUMP) when LTO
# is off). grep -q exits the instant it finds a match, closing its end of
# the pipe while the LLVM tool may still be writing; this toolchain's
# llvm-nm/llvm-objdump (11.1.0) abort hard on the resulting SIGPIPE instead
# of exiting quietly like GNU nm/objdump would - so the crash could happen
# in EITHER tool, regardless of the LTO setting. The patch rewrites all 3
# occurrences of this idiom in scripts/Makefile.build to capture the tool's
# full output via command substitution first (`printf '%s' "$$(TOOL ...)"
# | grep -q ...`), so the tool always runs to completion and exits
# normally before grep ever sees (or can prematurely close) the pipe. This
# is the actual fix; LTO is kept off too as a harmless, already-verified
# secondary change, not because it's load-bearing anymore. Verified
# locally: rebuilt kernel/panic.o (which genuinely exports symbols, ie.
# exercises the match branch) end-to-end with no errors.
#
# UPDATE 3: drivers/kernelsu/ksud.c, sucompat.c and syscall_hook_manager.c
# each had a "#if LINUX_VERSION_CODE < 5.8/5.10" compat shim defining their
# own copy_from_user_nofault/copy_to_user_nofault/strncpy_from_user_nofault
# for older kernels. This 302 base, despite still reporting 5.4.x, has all
# three backported natively (real, non-static, EXPORT_SYMBOL_GPL'd in
# mm/maccess.c) - so the static-inline compat copies conflicted with them
# ("static declaration ... follows non-static declaration"). Removed the
# shims; the driver now just uses the kernel's own native versions.
#
# UPDATE 4: Samsung's own stock drivers/.../sec_debug_summary_probe() (NOT
# KernelSU code) calls several __init-annotated helpers without itself
# being marked __init - a pre-existing vendor annotation bug, harmless
# since probe() functions only ever run once at boot. The defconfig had
# this treated as fatal (CONFIG_SECTION_MISMATCH_WARN_ONLY unset); restored
# it to upstream's own default of "y" (warn, don't fail) - a build-strictness
# setting only, no functional/runtime change.
#
# UPDATE 5 (root cause of the real device hanging on the boot logo after
# flashing a build made with UPDATES 1-4): the build succeeded and the
# device accepted the boot image, but it then hung indefinitely on the ROM
# logo. Investigation via adb/TWRP on the real device showed:
#   - `find /vendor -iname "*.ko"` (run as root from TWRP terminal) returns
#     NOTHING - this device's firmware has zero kernel-module-loading
#     infrastructure anywhere, ruling out a vendor-module vermagic mismatch.
#   - `adb shell logcat -d` showed android.hardware.audio.service crash-
#     looping on SIGABRT (new PID every few seconds, respawned by init)
#     while system_server logged "Stream states not ready, retry
#     onReinitVolumes()" forever - the signature of a kernel with no
#     working audio HAL backend, which blocks this ROM's boot sequence
#     indefinitely.
#   - Root cause: this kernel source's defconfig (lineage/GSI-oriented)
#     marks many SoC drivers - audio codecs, camera ISP, display, video,
#     mobile-data/rmnet - as loadable modules (`=m`), meant to be loaded
#     from /vendor/lib/modules/ at runtime. Since this device's actual
#     firmware has no such modules and no loader for them, every one of
#     these drivers silently never initializes.
#   - Fix: convert every one of these drivers from module to built-in
#     across all THREE places that independently control this in this
#     tree: (a) the defconfig's own Kconfig lines (55 lines, `=m` -> `=y`);
#     (b) hardcoded `techpack/*/config/*.conf` Makefile fragments that
#     `export CONFIG_X=m` unconditionally for this SoC, overriding
#     whatever the defconfig says (~85 lines across audio/camera/
#     display/video/dataipa configs, including the device-named
#     techpack/audio/config/lahaina_a52s.conf); (c) raw, Kconfig-
#     independent `obj-m +=` lines directly in Kbuild files for the
#     rmnet/mobile-data driver (techpack/datarmnet{,-ext}/.../Kbuild).
#     Everything is now compiled directly into vmlinux/Image, matching
#     how the device's real stock kernel is actually built.
#
# UPDATE 6: making CONFIG_QCA_CLD_WLAN built-in (part of UPDATE 5) exposed
# a pre-existing dead-code issue: wlan_hdd_state_ctrl_param_create() in
# wlan_hdd_main.c is only ever called from `#ifdef MODULE` code, so with
# the driver now built-in it became an unused function and
# -Werror=unused-function killed the build. Wrapped the function's own
# definition in the same `#ifdef MODULE`/`#endif` guard as its only call
# site (its sibling wlan_hdd_state_ctrl_param_destroy() is used
# unconditionally elsewhere and was left untouched).
#
# UPDATE 7: making the WLAN and IPA drivers built-in (part of UPDATE 5)
# also exposed two link-time duplicate-symbol collisions, both harmless
# while the colliding driver was a separate module (separate symbol
# namespace) but fatal once both land in the same vmlinux:
#   - qcacld-3.0's own private `ipa_is_ready()` (a local ready-flag getter
#     in wlan_ipa_obj_mgmt_api.c, nothing to do with the real IPA
#     framework) collided with the real, exported `ipa_is_ready()` in
#     drivers/platform/msm/ipa_fmwk/ipa_fmwk.c. Renamed the private one to
#     `wlan_ipa_is_ready()` across its definition, declaration and 28
#     call sites, all contained within drivers/staging/qcacld-3.0/
#     components/ipa/.
#   - qca-wifi-host-cmn's own private `nl80211hdr_put()` (a cld80211
#     netlink-message helper in wlan_nlink_srv.c) collided with the real
#     `nl80211hdr_put()` in net/wireless/nl80211.c. Renamed the private
#     one to `cld80211hdr_put()` across its definition, declaration and
#     call sites, all contained within drivers/staging/qca-wifi-host-cmn/
#     utils/nlink/.
#
# UPDATE 8 (found after flashing a build made with UPDATES 1-7: device now
# booted fully and root worked, but WiFi never came up - no wlan0 interface
# at all): fresh boot dmesg (captured immediately after boot, via root
# from KernelSU, before the kernel ring buffer wrapped) showed icnss2
# successfully downloading WLAN firmware ("WLAN FW is ready") and
# assigning a MAC address, but then looping forever on "icnss2: Modules
# not initialized just return" - meaning the WLAN *host* driver
# (qcacld-3.0) never registered with icnss2 at all, even though it
# compiled and linked into vmlinux correctly (confirmed: zero mentions of
# hdd/cld/wiphy anywhere in dmesg - its init function never ran).
#   Root cause, found in wlan_hdd_main.c: when built as a loadable module
#   (the stock/reference design), module_init(hdd_module_init) runs
#   hdd_driver_load() immediately on insmod. But when built-in (as
#   UPDATE 5 made it, for the same no-module-support reason as
#   audio/camera/display/etc.), hdd_module_init()'s `#else` branch does
#   NOT call hdd_driver_load() - it only creates a write-only sysfs node
#   (/sys/kernel/boot_wlan) and waits for some *external* trigger to
#   write to it, which is expected to come from a vendor init.rc script.
#   This device's actual (unmodified, stock Samsung) vendor ramdisk does
#   try to bring WLAN up at boot, but via `modprobe qca_cld3_wlan
#   qca_cld3_qca6390` - Samsung's own closed-source module names, from
#   their own closed kernel build. This open-source kernel tree's WLAN
#   driver doesn't produce (or know about) modules with those names
#   under any build configuration, so that vendor trigger can never
#   satisfy either activation path (module OR the sysfs node) - WLAN was
#   simply never going to come up here no matter which way it was built,
#   without a kernel-side fix.
#   Fix: added a `late_initcall()` (runs after all core kernel
#   subsystems, including QDF's own init, are ready - module_init()'s
#   usual device_initcall() level would be too early, per this same
#   driver's own "QDF API cannot be used here" comment) that calls
#   hdd_driver_load() automatically for the built-in case, with a
#   hdd_loaded guard so it can't double-fire if something ever does
#   write to the sysfs node too. This needs no vendor/vendor_boot
#   changes at all - the WLAN host driver now starts itself; icnss2's
#   own firmware download (already working, independent of this) does
#   the rest once the host driver registers.
#
# UPDATE 9 (found after flashing a build made with UPDATES 1-8: device
# booted, root worked, wlan0/p2p0/wifi-aware0 interfaces now actually got
# created with MAC addresses - UPDATE 8's auto-load fix worked - but
# toggling WiFi on in Settings still failed): fresh logcat taken exactly
# during a WiFi-on toggle showed:
#   android.hardware.wifi-service: Failed to access driver state control
#     param No such file or directory, 2: No such file or directory
#   android.hardware.wifi-service: Failed to load WiFi driver
#   android.hardware.wifi-service: Wifi HAL start failed
#   HalDevMgr: Cannot start IWifi. Status: 9
#   WifiSelfRecovery: Already restarted wifi 2 times in last 1 hour.
#     Disabling wifi
#   Root cause: Samsung's closed-source WiFi HAL binary
#   (android.hardware.wifi-service - cannot be modified, it's a prebuilt
#   vendor blob) opens a /dev/wlan ("qcwlanstate") character device and
#   writes "ON"/"OFF" to it to signal WiFi being toggled from the UI, then
#   waits for the kernel driver to signal completion - this is a SEPARATE
#   mechanism from hdd_driver_load() itself, used unconditionally by this
#   HAL regardless of whether the kernel driver is built-in or a module.
#   That device is created by wlan_hdd_state_ctrl_param_create() - which
#   UPDATE 6 above wrapped in `#ifdef MODULE` (to fix the unused-function
#   warning that came from making WLAN built-in), so it never got created
#   once WLAN became built-in, and the HAL's open() on /dev/wlan returned
#   ENOENT ("No such file or directory") every time, failing WiFi HAL
#   start outright, regardless of UPDATE 8's auto-load fix having already
#   worked.
#   Fix: removed the `#ifdef MODULE` guard from
#   wlan_hdd_state_ctrl_param_create()'s definition again (restoring it to
#   unconditional) and call it from the non-MODULE hdd_module_init()
#   branch too (alongside wlan_init_sysfs()), so /dev/wlan always exists.
#   wlan_hdd_state_ctrl_param_write()'s own `if (!hdd_loaded)` guard means
#   this can't double-call hdd_driver_load() when the HAL later writes
#   "ON" after UPDATE 8's late_initcall already loaded it.
#
# UPDATE 10 (cosmetic, not a boot/root-breaking bug: the KernelSU-Next
# manager app showed a "Kernel update required" banner even though root
# itself worked fine): the manager's update check is actually driven by a
# SEPARATE, small "UAPI version" integer reported by the kernel's GET_INFO
# ioctl (kernelUAPIVersion), not by the big KSU_VERSION number alone. Our
# kernel never set this field at all (implicit uapi_version=0), while the
# manager expects it to be at or above what it was built against.
#   Fix: ported two small, self-contained upstream KernelSU-Next commits
#   onto our existing v3.0.1-based tree, WITHOUT doing a full file-layout
#   migration to a newer KernelSU-Next release (that was evaluated and
#   rejected as disproportionately risky for a cosmetic warning):
#     - uapi_version 1: report KERNEL_SU_UAPI_VERSION via GET_INFO's new
#       `uapi_version` field in struct ksu_get_info_cmd (supercalls.h/.c).
#     - uapi_version 2: on-disk allowlist format v4 - adds a `flags` field
#       to struct root_profile (app_profile.h) with FLAG_KSU_NO_NEW_PRIVS,
#       a new KSU_IOCTL_DISABLE_ESCAPE_TO_ROOT ioctl ('K', 21 - verified
#       unused) and TIF_KSU_DISABLE_ESCAPE_WITH_ROOT (bit 63 of
#       thread_info.flags - verified unused on this kernel, highest TIF_*
#       in use is 26), enforced in escape_with_root_profile()
#       (app_profile.c). allowlist.c's FILE_FORMAT_VERSION bumped 3 -> 4;
#       a stale (older-version) on-disk allowlist file is now safely
#       discarded instead of being misparsed against the new struct
#       layout (apps just fall back to their default profile until
#       re-granted via the manager; a correctly-sized file is written
#       back the next time a profile is saved).
#   Also bumped KSU_VERSION_TAG/KSU_GIT_VERSION in drivers/kernelsu/Makefile
#   from v3.0.1/2967 to v3.0.1/3189, since we now genuinely carry the
#   NO_NEW_PRIVS feature that upstream rev 3189 introduced - this also
#   honestly clears the manager's separate MINIMAL_SUPPORTED_KERNEL=33188
#   big-number gate (new KSU_VERSION = 33189), which was found during
#   investigation but turned out NOT to be the actual source of the "Kernel
#   update required" banner on its own.
#   Deliberately NOT ported: upstream's uapi_version 3 ("scoped su-session
#   driver fd") - it rewrites the live execve/su hijack hot path
#   (sucompat.c) in ways that don't map cleanly onto this tree's simpler,
#   differently-organized version of that file, and the risk of regressing
#   root itself outweighed one more version number for what is purely a
#   cosmetic manager-UI check. If the manager still nags above
#   KERNEL_SU_UAPI_VERSION=2, that feature is the next candidate to port.
#
# UPDATE 11 (module installs/removals and metamodule mount/zygisk
# intermittently never happening at all, requiring a manual
# `ksud post-fs-data` over adb to actually apply): confirmed via on-device
# logs that the kernel's init.rc-injection trigger for "post-fs-data"
# (the one that execs `ksud post-fs-data`) races against exactly when
# /data is ready on this device/kernel combo. On a failing boot, ksud's
# handle_updated_modules/prune_modules/module-mount calls all fail with
# "No such file or directory", leaving pending module installs/removals
# stuck and the metamodule mount + zygisk start never happening that
# boot - even though manually re-running the exact same command after
# boot always succeeds. Fix: drivers/kernelsu/ksud.c's injected init.rc
# block (KERNEL_SU_RC) now also re-execs `ksud post-fs-data` at the
# property:sys.boot_completed=1 trigger, well after /data is
# unquestionably ready, as a safety-net retry. This is safe: the
# kernel's own on_post_fs_data() is already a one-shot guarded by a
# `done` flag, and re-running ksud's PostFsData module handling was
# verified manually on-device to be idempotent (it just finishes
# whatever didn't complete the first time).
#
# Verified end-to-end LOCALLY with this exact patch on a fresh clone: a full
# `make` (no target, i.e. everything) completed with zero errors, produced
# both vmlinux and arch/arm64/boot/Image, and - critically - `MODPOST 0
# modules` / zero `.ko` files anywhere in the output tree, confirming every
# driver is now built directly into the kernel with nothing left that would
# need /vendor module support this device doesn't have.
#
# Run it from Actions tab -> "Build a52sxq KernelSU-Next kernel (5.4.302)" -> Run workflow.
# Output: artifact "a52sxq-ksu-next-kernel-302" with Image + build.log.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "owner/repo of the 302 base kernel source"
        required: true
        default: "anhdat1024/android_kernel_samsung_sm7325"
      kernel_ref:
        description: "Branch/tag to build"
        required: true
        default: "17.0"
      defconfig:
        description: "Defconfig path under arch/arm64/configs/"
        required: true
        default: "vendor/lineage-a52sxq_defconfig"
      clang_release:
        description: "ZyCromerZ/Clang release tag to use as toolchain"
        required: true
        default: "11.1.0-20220724-release"
      clang_tarball:
        description: "Matching tarball file name for that release"
        required: true
        default: "Clang-11.1.0-20220724.tar.gz"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      # Checks out THIS repo (to get ksu-302-merge.patch) into the
      # workspace root; the kernel source itself is checked out
      # separately below, into ./kernel.
      - name: Checkout this repo (for the merge patch)
        uses: actions/checkout@v4

      - name: Checkout 302 kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1
          path: kernel

      - name: Apply KernelSU-Next + SUSFS merge patch
        working-directory: kernel
        run: |
          set -e
          git apply --verbose ../ksu-302-merge.patch
          echo "--- sanity check ---"
          grep -m3 -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile
          test -d drivers/kernelsu
          # Fail fast (seconds, not an hour) if the llvm-nm/llvm-objdump
          # SIGPIPE-abort fix didn't make it into the patch for some reason.
          count="$(grep -c "printf '%s'" scripts/Makefile.build || true)"
          if [ "$count" -lt 3 ]; then
            echo "::error::scripts/Makefile.build is missing the SIGPIPE-safe printf fix (found $count/3 occurrences) - the build would crash again in llvm-nm/llvm-objdump. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the ksud.c static-declaration-conflict fix is missing.
          if grep -q "^static inline long copy_from_user_nofault" drivers/kernelsu/ksud.c; then
            echo "::error::drivers/kernelsu/ksud.c still defines its own copy_from_user_nofault() - this conflicts with the one natively backported in this 302 base and will fail to build. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the section-mismatch fatal-vs-warning fix is missing.
          if ! grep -q "^CONFIG_SECTION_MISMATCH_WARN_ONLY=y" arch/arm64/configs/${{ inputs.defconfig }}; then
            echo "::error::CONFIG_SECTION_MISMATCH_WARN_ONLY=y is missing from the defconfig - Samsung's stock sec_debug_summary_probe() section mismatch will be fatal and fail the build. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if any driver is still set to build as a loadable
          # module (=m) in the defconfig. This device's real firmware has
          # NO module-loading support at all (confirmed on-device via
          # TWRP), so any `=m` here means that driver silently never
          # initializes on the real phone - this is what caused the
          # device to hang on the boot logo (audio HAL crash-loop) before.
          mod_count="$(grep -c "=m$" arch/arm64/configs/${{ inputs.defconfig }} || true)"
          if [ "$mod_count" -ne 0 ]; then
            echo "::error::$mod_count driver(s) in the defconfig are still set to build as loadable modules (=m). This device has no module-loading support and will hang on the boot logo. Check ksu-302-merge.patch."
            grep "=m$" arch/arm64/configs/${{ inputs.defconfig }}
            exit 1
          fi
          # Same check for the hardcoded per-SoC techpack/*/config/*.conf
          # Makefile fragments, which `export CONFIG_X=m` unconditionally
          # and silently override whatever the defconfig says.
          conf_mod_count="$(grep -rl "^export CONFIG_.*=m$" techpack/ drivers/staging/ 2>/dev/null | wc -l)"
          if [ "$conf_mod_count" -ne 0 ]; then
            echo "::error::$conf_mod_count techpack/*/config/*.conf file(s) still force a driver to =m, overriding the defconfig. Check ksu-302-merge.patch."
            grep -rl "^export CONFIG_.*=m$" techpack/ drivers/staging/ 2>/dev/null
            exit 1
          fi
          # Fail fast if the rmnet (mobile data) driver's raw, Kconfig-
          # independent obj-m lines are still module-mode.
          if grep -q "^obj-m" techpack/datarmnet/core/Kbuild techpack/datarmnet-ext/shs/Kbuild techpack/datarmnet-ext/offload/Kbuild 2>/dev/null; then
            echo "::error::The rmnet driver's Kbuild files still contain obj-m lines. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the WLAN built-in fixes (the two renamed-symbol
          # collisions) are missing.
          if ! grep -q "wlan_ipa_is_ready" drivers/staging/qcacld-3.0/components/ipa/core/src/wlan_ipa_main.c; then
            echo "::error::wlan_ipa_is_ready rename is missing - building WLAN+IPA in will fail with a duplicate-symbol link error against ipa_fmwk's ipa_is_ready(). Check ksu-302-merge.patch."
            exit 1
          fi
          if ! grep -q "cld80211hdr_put" drivers/staging/qca-wifi-host-cmn/utils/nlink/src/wlan_nlink_srv.c; then
            echo "::error::cld80211hdr_put rename is missing - building WLAN in will fail with a duplicate-symbol link error against net/wireless/nl80211.c's nl80211hdr_put(). Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the built-in WLAN auto-load fix (UPDATE 8) is
          # missing - without it WLAN compiles and links fine but never
          # actually starts (no wlan0 ever appears), since this device's
          # stock vendor init only knows how to trigger Samsung's own
          # closed-source WLAN module, not this driver.
          if ! grep -q "late_initcall(hdd_driver_load_late_init)" drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c; then
            echo "::error::hdd_driver_load_late_init auto-load fix is missing - built-in WLAN will compile fine but never actually come up (no wlan0). Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the /dev/wlan control-device fix (UPDATE 9) is
          # missing - without it, Samsung's closed-source WiFi HAL
          # (android.hardware.wifi-service) can't find /dev/wlan and WiFi
          # can never be turned on from Settings, even though the kernel
          # driver itself loads and wlan0 exists.
          param_create_count="$(grep -c "wlan_hdd_state_ctrl_param_create" drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c || true)"
          if [ "$param_create_count" -lt 3 ]; then
            echo "::error::wlan_hdd_state_ctrl_param_create() is not called from both the module and built-in hdd_module_init() paths - the closed-source WiFi HAL's /dev/wlan control device won't exist and WiFi HAL start will fail with ENOENT. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the UAPI-version-reporting fix (UPDATE 10) is
          # missing - without it the manager app shows a "Kernel update
          # required" banner (cosmetic, root itself still works).
          if ! grep -q "KERNEL_SU_UAPI_VERSION" drivers/kernelsu/supercalls.h; then
            echo "::error::KERNEL_SU_UAPI_VERSION is missing from drivers/kernelsu/supercalls.h - the manager's 'Kernel update required' banner fix did not make it into the patch. Check ksu-302-merge.patch."
            exit 1
          fi
          if ! grep -q "cmd.uapi_version = KERNEL_SU_UAPI_VERSION" drivers/kernelsu/supercalls.c; then
            echo "::error::GET_INFO's uapi_version field is not being set in drivers/kernelsu/supercalls.c - the manager will still see uapi_version=0 and keep showing 'Kernel update required'. Check ksu-302-merge.patch."
            exit 1
          fi
          if ! grep -q "^KSU_GIT_VERSION := 3189" drivers/kernelsu/Makefile; then
            echo "::error::drivers/kernelsu/Makefile's KSU_GIT_VERSION was not bumped to 3189 - KSU_VERSION would stay below the manager's MINIMAL_SUPPORTED_KERNEL gate. Check ksu-302-merge.patch."
            exit 1
          fi
          # Fail fast if the post-fs-data boot-completed retry (UPDATE 11)
          # is missing - without it, module installs/removals and the
          # metamodule mount/zygisk start can intermittently never happen
          # on a given boot, requiring a manual `ksud post-fs-data` over
          # adb to fix (cosmetic-looking but very confusing symptom).
          rc_block_lines=$(sed -n '/static const char KERNEL_SU_RC\[\] =/,/^\t"\\n";/p' drivers/kernelsu/ksud.c)
          post_fs_data_count=$(echo "$rc_block_lines" | grep -c '" post-fs-data\\n"')
          if [ "$post_fs_data_count" -lt 2 ]; then
            echo "::error::drivers/kernelsu/ksud.c's injected init.rc block (KERNEL_SU_RC) only execs 'ksud post-fs-data' once - the boot-completed safety-net retry is missing, so module installs/removals and metamodule mount/zygisk can silently never happen on a given boot. Check ksu-302-merge.patch."
            exit 1
          fi

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential git curl ca-certificates python3 \
            rsync unzip zip

      - name: Download clang toolchain (self-contained, includes its own binutils)
        run: |
          set -e
          mkdir -p clang
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/ZyCromerZ/Clang/releases/download/${{ inputs.clang_release }}/${{ inputs.clang_tarball }}" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions (sanity check)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version
          ld.lld --version
          llvm-ar --version

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 DISABLE_WRAPPER=1 ${{ inputs.defconfig }}
          echo "--- sanity check: LTO should be OFF (secondary change, kept but not load-bearing anymore) ---"
          grep -E "^CONFIG_LTO_CLANG=y|^CONFIG_LTO_NONE=y" out/.config || true
          if grep -q "^CONFIG_LTO_CLANG=y" out/.config; then
            echo "::error::CONFIG_LTO_CLANG is still enabled - the defconfig fix did not take effect."
            exit 1
          fi
          # `| tee` for live Actions-UI output. The real SIGPIPE-abort fix
          # now lives in scripts/Makefile.build itself (already verified
          # present above), not in avoiding this pipe, so tee is safe here
          # regardless of LTO state.
          set -o pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 DISABLE_WRAPPER=1 -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts
          found=0
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              cp "kernel/out/arch/arm64/boot/$f" artifacts/
              found=1
            fi
          done
          find kernel/out -maxdepth 4 -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          ls -la artifacts/
          if [ "$found" -eq 0 ]; then
            echo "::error::No kernel Image/Image.gz/Image.gz-dtb was produced - the build failed. Check build.log in the uploaded artifact."
            exit 1
          fi
          # This device has NO module-loading support at all (confirmed
          # on-device via TWRP: `find /vendor -iname "*.ko"` returns
          # nothing), and every driver was deliberately converted to
          # built-in for exactly that reason (see UPDATE 5-7 above). So
          # unlike a normal device, a .ko appearing here would mean a
          # regression - some driver silently reverted to module mode -
          # not a thing to collect and ship; it would never load on the
          # real device anyway and the driver behind it would just be
          # missing again (this is what caused the original boot-logo
          # hang). Fail the build if that ever happens again.
          mod_count="$(find kernel/out -name "*.ko" | wc -l)"
          echo "modules produced by this build: $mod_count (expected: 0)"
          if [ "$mod_count" -ne 0 ]; then
            echo "::error::$mod_count .ko module(s) were produced - some driver reverted to module mode. This device cannot load kernel modules, so that driver would silently fail to initialize on the real phone (this is what caused the original boot-logo hang). Modules found:"
            find kernel/out -name "*.ko"
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-ksu-next-kernel-302
          path: artifacts/
          retention-days: 14
