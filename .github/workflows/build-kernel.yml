name: Build a52sxq KernelSU-Next kernel

# Builds JUST the kernel (not the whole ROM) from
# A52s-5G-Testing/kernel_samsung_sm7325-root, branch 16.2-ksun-susfs
# (KernelSU-Next + SUSFS already integrated in the defconfig).
#
# This kernel's Makefile has built-in support for a full-LLVM build
# (CC=clang, LD=ld.lld, AR=llvm-ar, NM=llvm-nm, OBJCOPY=llvm-objcopy,
# OBJDUMP=llvm-objdump, STRIP=llvm-strip) that activates automatically
# whenever `LLVM=1` is passed to make - see Makefile lines ~408-444.
# That means a single self-contained clang toolchain (which bundles
# its own llvm-ar/llvm-nm/etc, i.e. its own "binutils") is enough;
# no separate GCC cross-toolchain is needed.
#
# The defconfig's own CONFIG_CC_VERSION_TEXT records the kernel was
# last built with "clang version 11.0.2 (... r383902b1)". The closest
# easily-downloadable prebuilt matching that is clang 11.1.0 from
# ZyCromerZ/Clang (a well-known community mirror of AOSP clang
# releases, distributed as a plain .tar.gz - far more reliable in CI
# than sparse-cloning the huge android.googlesource.com history).
#11.0.2 vs 11.1.0 is a minor point release apart; for compiling an
# out-of-tree Android common kernel this virtually never matters -
# only exact-KMI-matching GKI modules would care, and this is not that.
#
# Run it from Actions tab -> "Build a52sxq KernelSU-Next kernel" -> Run workflow.
# Output: an artifact named "a52sxq-ksu-next-kernel" containing
# Image/Image.gz/Image.gz-dtb (whichever the build produces) + the
# full build log, downloadable from the finished run's Summary page.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch/tag of kernel_samsung_sm7325-root to build"
        required: true
        default: "16.2-ksun-susfs"
      defconfig:
        description: "Defconfig path under arch/arm64/configs/"
        required: true
        default: "vendor/lineage-a52sxq_defconfig"
      clang_release:
        description: "ZyCromerZ/Clang release tag to use as toolchain"
        required: true
        default: "11.1.0-20220724-release"
      clang_tarball:
        description: "Matching tarball file name for that release"
        required: true
        default: "Clang-11.1.0-20220724.tar.gz"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: A52s-5G-Testing/kernel_samsung_sm7325-root
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1
          path: kernel

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential git curl ca-certificates python3 \
            rsync unzip zip

      - name: Download clang toolchain (self-contained, includes its own binutils)
        run: |
          set -e
          mkdir -p clang
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/ZyCromerZ/Clang/releases/download/${{ inputs.clang_release }}/${{ inputs.clang_tarball }}" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions (sanity check)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version
          ld.lld --version
          llvm-ar --version

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
        run: |
          set -e
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          # DISABLE_WRAPPER=1 turns off scripts/gcc-wrapper.py, the
          # Android-common-kernel mechanism that promotes any compiler
          # warning it doesn't already know about into a hard build
          # error ("error, forbidden warning: ..."). That mechanism is
          # meant to keep AOSP's own kernel tree warning-free across
          # exactly the compiler version they pin; with a slightly
          # different clang point release (11.1.0 here vs the 11.0.2
          # the defconfig was built with) a couple of pre-existing,
          # harmless warnings in Samsung's own vendor drivers
          # (techpack/video, drivers/input/sec_input) surface and trip
          # it, with no relation to the KernelSU patch at all. Disabling
          # the wrapper lets them stay warnings instead of aborting the
          # whole build.
          make O=out ARCH=arm64 LLVM=1 DISABLE_WRAPPER=1 ${{ inputs.defconfig }}
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 DISABLE_WRAPPER=1 -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts
          found=0
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              cp "kernel/out/arch/arm64/boot/$f" artifacts/
              found=1
            fi
          done
          find kernel/out -maxdepth 4 -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          ls -la artifacts/
          if [ "$found" -eq 0 ]; then
            echo "::error::No kernel Image/Image.gz/Image.gz-dtb was produced - the build failed. Check build.log in the uploaded artifact."
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-ksu-next-kernel
          path: artifacts/
          retention-days: 14
