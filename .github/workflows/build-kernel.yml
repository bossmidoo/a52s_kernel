name: Build a52sxq KernelSU-Next kernel

# Builds JUST the kernel (not the whole ROM) from
# A52s-5G-Testing/kernel_samsung_sm7325-root, branch 16.2-ksun-susfs
# (KernelSU-Next + SUSFS already integrated in the defconfig).
#
# Toolchain/flags below are copied from that repo's own
# build.config.common + build.config.aarch64 so this matches, as
# closely as possible, however the maintainers themselves build it:
#   CC=clang (AOSP prebuilt clang-r383902b1, i.e. clang 11.0.2 -
#             this is the exact version baked into the defconfig's
#             CONFIG_CC_VERSION_TEXT, so later/earlier clang can
#             produce a kernel that silently misbehaves or won't
#             boot even if it compiles)
#   LD=ld.lld, NM=llvm-nm, OBJCOPY=llvm-objcopy
#   CLANG_TRIPLE=aarch64-linux-gnu-
#   CROSS_COMPILE=aarch64-linux-androidkernel-
#   CROSS_COMPILE_COMPAT=arm-linux-androideabi-   (32-bit compat vDSO)
#   defconfig = vendor/lineage-a52sxq_defconfig
#
# Run it from Actions tab -> "Build a52sxq KernelSU-Next kernel" -> Run workflow.
# Output: an artifact named "a52sxq-ksu-next-kernel" containing
# Image, Image.gz, Image.gz-dtb (whichever the build produces) + the
# full build log, downloadable from the finished run's Summary page.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch/tag of kernel_samsung_sm7325-root to build"
        required: true
        default: "16.2-ksun-susfs"
      defconfig:
        description: "Defconfig path under arch/arm64/configs/"
        required: true
        default: "vendor/lineage-a52sxq_defconfig"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: A52s-5G-Testing/kernel_samsung_sm7325-root
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1
          path: kernel

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential git curl ca-certificates python3 \
            rsync unzip zip

      # Google publishes every released clang/gcc prebuilt in full git
      # history under android.googlesource.com. A full clone of any of
      # these repos is huge, so we do a blobless + sparse clone and
      # only materialize the one version directory we actually need.
      # (android.googlesource.com is reachable fine from GitHub-hosted
      # runners - it's only blocked inside the chat sandbox this
      # workflow was written in.)
      - name: Fetch matching Clang (clang-r383902b1 / 11.0.2)
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain-clang
          git -C toolchain-clang sparse-checkout set clang-r383902b1
          echo "$GITHUB_WORKSPACE/toolchain-clang/clang-r383902b1/bin" >> "$GITHUB_PATH"

      - name: Fetch matching GCC prebuilts (arm64 + arm32, for CROSS_COMPILE/CROSS_COMPILE_COMPAT)
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain-gcc-arm64
          git clone --filter=blob:none --sparse --depth 1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain-gcc-arm32
          echo "$GITHUB_WORKSPACE/toolchain-gcc-arm64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchain-gcc-arm32/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions (sanity check)
        run: |
          clang --version
          ld.lld --version
          aarch64-linux-androidkernel-gcc --version 2>/dev/null || echo "note: androidkernel- gcc wrapper not present, will rely on clang/lld only"
          aarch64-linux-android-gcc --version 2>/dev/null || true

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang
          LD: ld.lld
          NM: llvm-nm
          OBJCOPY: llvm-objcopy
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-android-
          CROSS_COMPILE_COMPAT: arm-linux-androideabi-
          KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
        run: |
          set -e
          make O=out ${{ inputs.defconfig }}
          make O=out -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              cp "kernel/out/arch/arm64/boot/$f" artifacts/
            fi
          done
          find kernel/out -maxdepth 4 -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-ksu-next-kernel
          path: artifacts/
          retention-days: 14
